<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Avni</title>
<link rel="stylesheet" href="style.css">
<style>
  .stage{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
    position:relative;
    z-index:2;
  }
  .kicker{
    font-family:'Caveat', cursive;
    font-size:1.5rem;
    color:var(--sage);
    margin:0 0 6px;
  }
  .title{
    font-size:clamp(2.6rem, 9vw, 4.6rem);
    font-weight:600;
    margin:0;
    color:var(--maroon-deep);
    line-height:1.05;
  }
  .title em{
    font-style:italic;
    font-weight:500;
    color:var(--gold);
    display:block;
    font-size:clamp(3.2rem, 12vw, 5.6rem);
    margin-top:4px;
  }

  /* envelope */
  .envelope-wrap{
    margin-top:44px;
    width:min(340px, 82vw);
  }
  .envelope{
    position:relative;
    width:100%;
    aspect-ratio:3/2;
    background:var(--paper);
    border:1px solid var(--paper-edge);
    border-radius:6px;
    box-shadow:0 20px 45px rgba(74,20,24,0.18);
    cursor:pointer;
    overflow:visible;
  }
  .flap{
    position:absolute;
    top:0;left:0;right:0;
    height:100%;
    clip-path:polygon(0 0, 100% 0, 50% 58%);
    background:linear-gradient(155deg, var(--blush), var(--paper) 70%);
    border-radius:6px 6px 0 0;
    transform-origin:top center;
    transition:transform .9s cubic-bezier(.6,-0.2,.2,1.3);
    z-index:3;
  }
  .envelope.open .flap{
    transform:rotateX(180deg);
  }
  .seal{
    position:absolute;
    top:52%;
    left:50%;
    width:58px;
    height:58px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 60%, #97772f 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.6rem;
    color:var(--maroon-deep);
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
    z-index:5;
    transition:opacity .4s ease .2s, transform .5s ease .2s;
  }
  .envelope.open .seal{
    opacity:0;
    transform:translate(-50%,-50%) scale(0.4) rotate(25deg);
  }
  .card-peek{
    position:absolute;
    left:6%;
    right:6%;
    bottom:6%;
    top:14%;
    background:var(--ivory);
    border:1px solid var(--paper-edge);
    border-radius:4px;
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    text-align:center;
    transition:transform .7s ease .35s;
    transform:translateY(0);
  }
  .envelope.open .card-peek{
    transform:translateY(-18%);
  }
  .card-peek p{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.05rem;
    color:var(--ink-soft);
    margin:0;
  }
  .tap-hint{
    margin-top:18px;
    font-size:0.95rem;
    color:var(--ink-soft);
    letter-spacing:0.3px;
  }

  .reveal{
    margin-top:34px;
    max-width:420px;
    opacity:0;
    transform:translateY(14px);
    transition:opacity .6s ease, transform .6s ease;
    pointer-events:none;
  }
  .reveal.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .reveal p{
    font-family:'Cormorant Garamond', serif;
    font-size:1.3rem;
    line-height:1.6;
    color:var(--ink);
  }
  .enter-btn{
    margin-top:10px;
    display:inline-block;
    background:var(--maroon);
    color:var(--ivory);
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.3rem;
    padding:13px 36px;
    border-radius:999px;
    box-shadow:0 10px 24px rgba(110,31,36,0.3);
    transition:transform .3s ease, background .3s ease;
  }
  .enter-btn:hover{transform:translateY(-2px);background:var(--maroon-deep);}
</style>
</head>
<body>

<svg class="corner-leaf tl" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <path d="M5 5 C 40 20, 30 60, 60 70 C 40 75, 20 60, 5 40 Z" fill="#8CA37C" opacity="0.5"/>
  <path d="M10 10 C 50 5, 70 35, 65 65 C 55 40, 35 30, 10 10 Z" fill="#55694A" opacity="0.4"/>
</svg>
<svg class="corner-leaf br" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <path d="M5 5 C 40 20, 30 60, 60 70 C 40 75, 20 60, 5 40 Z" fill="#8CA37C" opacity="0.5"/>
  <path d="M10 10 C 50 5, 70 35, 65 65 C 55 40, 35 30, 10 10 Z" fill="#55694A" opacity="0.4"/>
</svg>

<audio id="bgm" src="audio/voice.mp3" loop preload="auto"></audio>
<button id="bgm-toggle" aria-label="Play music"><span class="bars"><span></span><span></span><span></span></span></button>

<div class="stage">
  <p class="kicker">एक छोटा सा तोहफ़ा</p>
  <h1 class="title display">Happy Birthday<em>Avni</em></h1>

  <div class="envelope-wrap">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open the card">
      <div class="card-peek"><p>तुम्हारे नाम एक खत...</p></div>
      <div class="flap"></div>
      <div class="seal">A</div>
    </div>
    <p class="tap-hint">खोलने के लिए टैप करो ✉️</p>
  </div>

  <div class="reveal" id="reveal">
    <p>जन्मदिन मुबारक हो, अवनी। आज का दिन थोड़ा धीरे जीना — कुछ पल तुम्हारे लिए सजाए हैं, अंदर आओ।</p>
    <a class="enter-btn" href="memories.html">अंदर चलो →</a>
  </div>
</div>

<script src="script.js"></script>
<script>
  const envelope = document.getElementById('envelope');
  const reveal = document.getElementById('reveal');
  let opened = false;

  function openEnvelope(){
    if(opened) return;
    opened = true;
    envelope.classList.add('open');
    startBGM();
    setTimeout(()=>{ reveal.classList.add('show'); }, 550);
  }

  envelope.addEventListener('click', openEnvelope);
  envelope.addEventListener('keypress', (e)=>{
    if(e.key === 'Enter' || e.key === ' ') openEnvelope();
  });
</script>
</body>
</html>
