<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>कुछ यादें — Avni</title>
<link rel="stylesheet" href="style.css">
<style>
  .stage{
    max-width:1000px;
    margin:0 auto;
    padding:70px 24px 20px;
    position:relative;
    z-index:2;
  }
  .heading{
    text-align:center;
    margin-bottom:8px;
  }
  .heading .kicker{
    font-family:'Caveat', cursive;
    font-size:1.4rem;
    color:var(--sage);
    display:block;
    margin-bottom:4px;
  }
  .heading h1{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(2.2rem, 6vw, 3.2rem);
    font-weight:600;
    color:var(--maroon-deep);
    margin:0;
  }

  .board{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-start;
    gap:36px 28px;
    margin-top:60px;
    padding-bottom:40px;
  }
  .polaroid{
    background:#fff;
    padding:14px 14px 40px;
    width:250px;
    box-shadow:0 16px 30px rgba(43,33,24,0.18);
    transition:transform .35s ease, box-shadow .35s ease;
    position:relative;
  }
  .polaroid:nth-child(1){transform:rotate(-6deg);}
  .polaroid:nth-child(2){transform:rotate(4deg);margin-top:26px;}
  .polaroid:nth-child(3){transform:rotate(-3deg);}
  .polaroid:hover{
    transform:rotate(0deg) scale(1.04) translateY(-6px);
    box-shadow:0 22px 40px rgba(43,33,24,0.26);
    z-index:5;
  }
  .polaroid img{
    width:100%;
    height:290px;
    object-fit:cover;
    display:block;
    filter:saturate(1.02);
  }
  .caption{
    position:absolute;
    bottom:10px;
    left:14px;
    right:14px;
    text-align:center;
    font-family:'Caveat', cursive;
    font-size:1.3rem;
    color:var(--ink-soft);
  }

  .note{
    max-width:480px;
    margin:10px auto 0;
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.2rem;
    color:var(--ink-soft);
    line-height:1.6;
  }
</style>
</head>
<body>

<svg class="corner-leaf tl" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <path d="M5 5 C 40 20, 30 60, 60 70 C 40 75, 20 60, 5 40 Z" fill="#8CA37C" opacity="0.5"/>
  <path d="M10 10 C 50 5, 70 35, 65 65 C 55 40, 35 30, 10 10 Z" fill="#55694A" opacity="0.4"/>
</svg>
<svg class="corner-leaf br" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
  <path d="M5 5 C 40 20, 30 60, 60 70 C 40 75, 20 60, 5 40 Z" fill="#8CA37C" opacity="0.5"/>
  <path d="M10 10 C 50 5, 70 35, 65 65 C 55 40, 35 30, 10 10 Z" fill="#55694A" opacity="0.4"/>
</svg>

<audio id="bgm" src="audio/voice.mp3" loop preload="auto"></audio>
<button id="bgm-toggle" aria-label="Play music"><span class="bars"><span></span><span></span><span></span></span></button>

<div class="stage">
  <div class="heading">
    <span class="kicker">रुको, थोड़ा पीछे चलते हैं</span>
    <h1 class="display">कुछ पल, कुछ यादें</h1>
  </div>

  <div class="board">
    <div class="polaroid">
      <img src="images/photo1.jpg" alt="Avni">
      <p class="caption">बालों में हाथ फेरने वाला अंदाज़ 😌</p>
    </div>
    <div class="polaroid">
      <img src="images/photo2.jpg" alt="Avni">
      <p class="caption">फूलों के बीच भी सबसे अलग सी मुस्कान</p>
    </div>
    <div class="polaroid">
      <img src="images/photo3.jpg" alt="Avni">
      <p class="caption">यही वाली हँसी है ना, जो दिन बना देती है</p>
    </div>
  </div>

  <p class="note">हर फ़ोटो में एक जैसी बात है — तुम्हारी हँसी, बस वही याद रह जाती है।</p>
</div>

<div class="page-nav">
  <a href="feelings.html">एक बात और है →</a>
</div>

<script src="script.js"></script>
</body>
</html>
